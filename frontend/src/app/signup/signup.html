<div class="container">
  <div class="card">
    <div class="card-body">

      <h1>EcoTrack</h1>
      <p>Track your impact. Make a difference.</p>
      <h2>Create an Account</h2>

      <form novalidate>

        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input
            type="text"
            id="fullName"
            class="form-control"
            [formControl]="fullName"
            placeholder="Enter your full name"
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            [formControl]="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            [formControl]="password"
            placeholder="Create a password"
          />
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">
            Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            [formControl]="confirmPassword"
            placeholder="Confirm your password"
          />
        </div>

        <button
          type="button"
          class="btn btn-success"
          (click)="onSubmit()"
        >
          Sign Up
        </button>

        <button
          type="button"
          class="btn btn-outline-success mt-2"
          (click)="onLogin()"
        >
          Back to Login
        </button>

        <div
          *ngIf="message"
          class="form-message"
          [class.success]="messageType === 'success'"
          [class.error]="messageType === 'error'"
        >
          {{ message }}
        </div>

      </form>
    </div>
  </div>
</div>


<div class="reset-container">
  <div class="reset-card">
    <h1>EcoTrack</h1>

    <p class="subtitle">Track your impact. Make a difference.</p>

    <h2>Reset Your Password</h2>

    <p class="description">
      Enter your new password below.
    </p>

    <form novalidate (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="password">New Password</label>

        <input
          type="password"
          id="password"
          [formControl]="password"
          placeholder="Enter your new password"
        />

        <small *ngIf="password.touched && password.hasError('required')">
          Password is required.
        </small>

        <small *ngIf="password.touched && password.hasError('minlength')">
          Password must contain at least 8 characters.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>

        <input
          type="password"
          id="confirmPassword"
          [formControl]="confirmPassword"
          placeholder="Confirm your new password"
        />

        <small *ngIf="confirmPassword.touched && confirmPassword.hasError('required')">
          Please confirm your new password.
        </small>
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Updating Password...' : 'Update Password' }}
      </button>

      <button
        type="button"
        class="login-button"
        (click)="goToLogin()"
        [disabled]="isLoading"
      >
        Back to Login
      </button>

      <div
        *ngIf="message"
        class="message"
        [class.success]="messageType === 'success'"
        [class.error]="messageType === 'error'"
        role="alert"
      >
        {{ message }}
      </div>
    </form>
  </div>
</div>
